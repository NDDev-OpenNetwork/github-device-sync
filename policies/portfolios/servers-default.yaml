schema_version: 1

# A cross-owner policy. A `server-` prefixed repository is governed the same
# way whoever owns it, which is exactly what an owner tier cannot express --
# name prefixes reach across owner boundaries without inventing a grouping
# label.
policy:
  id: "servers-default"
  tier: "portfolio"
  priority: 100
  distribution: "public"

match:
  name_prefixes:
    - "server-"

apply:
  git:
    integration: "direct"
    branch_cleanup: "merged-only"

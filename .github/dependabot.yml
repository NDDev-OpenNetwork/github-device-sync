version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - dependencies
    groups:
      gomod:
        applies-to: version-updates
        patterns:
          - "*"

      gomod-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - dependencies
      - ci
    # The Go caller is generated. Update ci.workflow_ref in .gds/repository.yaml
    # and regenerate through gds generate repository --plan/--apply; editing the
    # output alone breaks its bundle provenance. Other workflow pins remain
    # visible as Dependabot proposals and retain ordinary review.
    ignore:
      - dependency-name: "NDDev-OpenNetwork/ci-workflows/.github/workflows/go-ci.yml"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns: ['*']
  # Hash-pinned test and schema-validator environments bootstrapped by
  # scripts/validate_ci_tier.sh. Updates must keep the --require-hashes
  # contract intact.
  - package-ecosystem: pip
    directory: "/requirements"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - dependencies
      - ci
    groups:
      python:
        applies-to: version-updates
        patterns:
          - "*"
      pip-security:
        applies-to: security-updates
        patterns: ['*']

schema_version: 1

# Priority 200: more specific than organization-sources, which would otherwise
# claim these too. Selection is by name prefix, so a repository joins the
# portfolio by being named for what it is.
selector:
  id: "organization-servers"
  priority: 200

match:
  owner: "owner:acme"
  fork: false
  name_prefixes:
    - "server-"

assign:
  management_mode: "observe-only"
  portfolios:
    - "portfolio:servers"
  policy_profiles:
    - "repository-default"
    - "servers-default"
  rollout_ring: "standard"

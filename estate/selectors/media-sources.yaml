schema_version: 1

selector:
  id: "media-sources"
  priority: 100

match:
  owner: "owner:media"
  fork: false

assign:
  management_mode: "observe-only"
  portfolios:
    - "portfolio:organization-projects"
  policy_profiles:
    - "repository-default"
    - "organization-default"
  rollout_ring: "standard"

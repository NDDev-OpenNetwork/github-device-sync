schema_version: 1

# One device. A device declares where repositories are materialized on it and
# which agent harnesses it runs -- not what the estate contains, which is the
# estate's own business.
device:
  id: "device_01JEXAMPZ00000000000000000"
  name: "example-workstation"
  os: "linux"
  architecture: "x86_64"
  class:
    profile: "desktop"
    gui: "enabled"
    docker_mode: "none"
    execution_policy: "source-lsp-only"

workspace_roots:
  organization: "${HOME}/Developer/organization"
  personal: "${HOME}/Developer/personal"
  servers: "${HOME}/Developer/servers"

materialization:
  default_mode: "absent"
  # Trait-matched placement: repositories land under a root by their provider
  # facts, not by a label an anchor must carry. Order matters -- the first
  # matching include wins, so `server-` repositories reach their own root
  # before the generic owner rules apply.
  include:
    - match:
        owner_login: "example-org"
        name_prefixes:
          - "server-"
      workspace_root: "servers"
      mode: "active"
    - match:
        owner_login: "example-user"
        name_prefixes:
          - "server-"
      workspace_root: "servers"
      mode: "active"
    - match:
        owner_login: "example-org"
      workspace_root: "organization"
      mode: "active"
    - match:
        owner_login: "example-user"
      workspace_root: "personal"
      mode: "active"

harnesses:
  - "claude-code"

state:
  path: "${XDG_STATE_HOME}/github-device-sync"

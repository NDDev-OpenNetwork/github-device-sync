schema_version: 1

repository:
  id: "repo_01JEXAMPZ0000000000000000C"
  display_name: "public-module-fork"
  roles:
    - "module"
  lifecycle: "active"

provider:
  type: "github"
  installation: "installation:github-organization"
  repository_id: 123456789
  owner: "example-org"
  name: "public-module-fork"
  aliases:
    - owner: "example-user"
      name: "old-public-module-fork"

classification:
  portfolios:
    - "portfolio:public-modules"
  visibility_contract: "public"
  data_classification: "public"

policy:
  profiles:
    - "repository-default"
    - "public-module"
  rollout_ring: "canary-modules"

git:
  default_branch: "main"
  integration: "pull-request"
  branch_model: "task-branches"
  handoff_pr: "preferred"
  cleanup: "merged-only"

agent:
  context_profile: "public-module"
  generated_agents: true
  serena:
    enabled: true
    provenance_required: true

relationships:
  - type: "fork-of"
    target: "repo_01JEXAMPZ0000000000000000D"
  - type: "package-consumer"
    target: "repo_01JEXAMPZ0000000000000000E"

module:
  contract: "public"
  consumption:
    - "git-submodule"
    - "package"
  compatibility: "semver"
  pin_policy: "version-tag"
  publication:
    registry: "npm"
    github_release: "required"

fork:
  upstream:
    provider: "github"
    repository_id: 987654321
    owner: "upstream-owner"
    name: "public-module"
  policy: "maintained-patch"
  sync_branch: "main"
  preserve_fork_commits: true
  allow_force_sync: false

release:
  mode: "version-tag"

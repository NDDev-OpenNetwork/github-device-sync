schema_version: 1

installation:
  id: "installation:github-personal"
  provider: "github"
  account_type: "user"
  account_login: "example-user"
  app_installation_id_source: "secure-runtime"

management:
  discover_all_repositories: true
  default_mode: "observe-only"

permissions:
  repository_selection: "all"
  repository:
    metadata: "admin"
  organization: {}

credentials:
  strategy: "github-app-installation-token"
  secret_ref: "secret:gds/github-app/example"

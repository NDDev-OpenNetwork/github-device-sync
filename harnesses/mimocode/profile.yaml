schema_version: 1

harness_profile:
  id: "mimocode"
  product: "mimocode"
  status: "provisional"
  aliases: []
  capability_version: "2026-07-11"
  verified_at: "2026-07-11"
  official_sources:
    - "https://mimo.mi.com/docs/en-US/tokenplan/integration/mimo-code"
    - "https://mimo.mi.com/docs/en-US/news/latest/mimocode"
  detection:
    command_candidates:
      - "mimo"
      - "mimocode"
    version_arguments:
      - "--version"
  instructions:
    native_agents: true
    nested_chain: "workspace-root-only"
    imports: false
  skills:
    standard: "agent-skills"
    native_paths:
      - ".mimocode/skills"
      - ".agents/skills"
      - ".claude/skills"
    symlinks: false
    explicit_only:
      mechanism: "profile-exclusion"
  projection:
    instruction_strategy: "native-agents"
    skill_strategy: "canonical-path"
  hooks:
    supported: false
    lifecycle: []
  runtime_tests:
    required: false
    last_result: "delegated"

schema_version: 1

harness_profile:
  id: "claude-code"
  product: "claude-code"
  status: "supported"
  aliases: []
  capability_version: "2026-07-11"
  verified_at: "2026-08-28"
  official_sources:
    - "https://code.claude.com/docs/en/memory"
    - "https://code.claude.com/docs/en/skills"
    - "https://code.claude.com/docs/en/hooks"
  detection:
    command_candidates:
      - "claude"
    version_arguments:
      - "--version"
  instructions:
    native_agents: false
    nested_chain: "root-to-cwd"
    imports: false
  skills:
    standard: "agent-skills"
    native_paths:
      - ".claude/skills"
    symlinks: false
    explicit_only:
      mechanism: "disable-model-invocation"
  projection:
    instruction_strategy: "generated-first-class"
    skill_strategy: "generated-copy"
  hooks:
    supported: true
    lifecycle:
      - "session-start"
      - "user-prompt-submit"
      - "pre-tool-use"
      - "post-tool-use"
      - "stop"
  runtime_tests:
    required: false
    last_result: "delegated"

schema_version: 1

harness_profile:
  id: "kimicode"
  product: "kimicode"
  status: "provisional"
  aliases: []
  capability_version: "2026-07-11"
  verified_at: "2026-07-11"
  official_sources:
    - "https://moonshotai.github.io/kimi-code/en/customization/skills"
    - "https://moonshotai.github.io/kimi-code/en/customization/hooks"
    - "https://moonshotai.github.io/kimi-code/en/customization/agents"
  detection:
    command_candidates:
      - "kimi"
    version_arguments:
      - "--version"
  instructions:
    native_agents: true
    nested_chain: "custom"
    imports: false
  skills:
    standard: "agent-skills"
    native_paths:
      - ".agents/skills"
      - ".kimi-code/skills"
    symlinks: false
    explicit_only:
      mechanism: "disable-model-invocation"
  projection:
    instruction_strategy: "native-agents"
    skill_strategy: "canonical-path"
  hooks:
    supported: true
    lifecycle:
      - "session-start"
      - "user-prompt-submit"
      - "pre-tool-use"
      - "post-tool-use"
      - "stop"
  runtime_tests:
    required: false
    last_result: "delegated"

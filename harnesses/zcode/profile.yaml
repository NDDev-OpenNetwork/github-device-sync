schema_version: 1

harness_profile:
  id: "zcode"
  product: "zcode"
  status: "provisional"
  aliases: []
  capability_version: "2026-07-11"
  verified_at: "2026-07-11"
  official_sources:
    - "https://zcode.z.ai/en/docs/agents"
    - "https://zcode.z.ai/en/docs/skill"
  detection:
    command_candidates:
      - "zcode"
    version_arguments:
      - "--version"
  instructions:
    native_agents: true
    nested_chain: "workspace-root-only"
    imports: false
  skills:
    standard: "agent-skills"
    native_paths:
      - ".zcode/skills"
      - "~/.zcode/skills"
    symlinks: true
    explicit_only:
      mechanism: "manual-dollar-skill"
  projection:
    instruction_strategy: "workspace-root-flattened"
    skill_strategy: "local-symlink"
  hooks:
    supported: false
    lifecycle: []
  runtime_tests:
    required: false
    last_result: "delegated"

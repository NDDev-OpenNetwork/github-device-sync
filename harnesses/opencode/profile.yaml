schema_version: 1

harness_profile:
  id: "opencode"
  product: "opencode"
  status: "supported"
  aliases: []
  capability_version: "2026-07-11"
  verified_at: "2026-08-28"
  official_sources:
    - "https://opencode.ai/docs/rules/"
    - "https://opencode.ai/docs/skills/"
  detection:
    command_candidates:
      - "opencode"
    version_arguments:
      - "--version"
  instructions:
    native_agents: true
    nested_chain: "root-to-cwd"
    imports: false
  skills:
    standard: "agent-skills"
    native_paths:
      - ".agents/skills"
      - ".opencode/skills"
      - ".claude/skills"
    symlinks: false
    explicit_only:
      mechanism: "profile-exclusion"
  projection:
    instruction_strategy: "native-agents"
    skill_strategy: "canonical-path"
  hooks:
    supported: false
    lifecycle: []
  runtime_tests:
    required: false
    last_result: "delegated"

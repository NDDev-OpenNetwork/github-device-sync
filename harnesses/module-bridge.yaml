schema_version: 1
contract: "nddev-module-harness-bridge/v2"

consumer:
  repository_id: "repo_01M0QNDKCJ0K9XZHXVPCERB4XK"
relationship_scope: "git-submodule-consumer"
evidence_owner:
  repository: "NDDev-it-com/setup-systems"
runtime_tests:
  required: false

# Seven harnesses, seven setup systems, one mapping each. The retired harness
# application line is archived and is deliberately not named in this file --
# not as a module, not as an alias. A bridge is a statement about what exists;
# ADR 0037 holds the history.
#
# `harness_id` is the ai-stp contract value and is never derived from the
# module name. Deriving it from a module name is how two identities here were
# once invented, which ADR 0036 records.
mappings:
  - module_id: "antigravity-setup-system"
    harness_id: "antigravity"
    lifecycle: "active"
  - module_id: "claude-setup-system"
    harness_id: "claude-code"
    lifecycle: "active"
  - module_id: "codex-setup-system"
    harness_id: "codex"
    lifecycle: "active"
  - module_id: "cursor-setup-system"
    harness_id: "cursor"
    lifecycle: "active"
  - module_id: "grok-setup-system"
    harness_id: "grok-build"
    lifecycle: "active"
  - module_id: "opencode-setup-system"
    harness_id: "opencode"
    lifecycle: "active"
  - module_id: "pi-setup-system"
    harness_id: "pi"
    lifecycle: "active"
